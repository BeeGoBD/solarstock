<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24272c" />
      <stop offset="50%" stop-color="#191b1e" />
      <stop offset="100%" stop-color="#0f1012" />
    </linearGradient>
    <linearGradient id="gpBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555d68" />
      <stop offset="100%" stop-color="#23272d" />
    </linearGradient>
    <linearGradient id="yellowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb024" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad2)" />

  <!-- Diagonal Yellow Geometric Shapes at Bottom -->
  <polygon points="0,620 180,800 0,800" fill="#fbb024" />
  <polygon points="800,620 620,800 800,800" fill="#fbb024" />
  <polygon points="0,680 800,680 800,800 0,800" fill="#f59e0b" opacity="0.9" />

  <!-- Top Left Brand -->
  <g transform="translate(35, 60)">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#9ca3af" letter-spacing="1">
      SOLARSTOCK<tspan font-size="20" dy="-14" fill="#60a5fa">BD</tspan>
    </text>
    <text x="35" y="32" font-family="'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif" font-size="20" fill="#cbd5e1" font-style="italic">
      Beat The Clock
    </text>
  </g>

  <!-- Top Right Disc 20% Flag Ribbon -->
  <g transform="translate(610, 0)">
    <path d="M0,0 L115,0 L115,160 L57.5,130 L0,160 Z" fill="url(#yellowGrad2)" filter="url(#shadow2)" />
    <text x="57" y="70" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#18181b" text-anchor="middle">Disc</text>
    <text x="57" y="118" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#18181b" text-anchor="middle">20%</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <text font-family="'Arial Black', 'Impact', sans-serif" font-size="68" font-weight="900" fill="#f59e0b" letter-spacing="4">GP</text>
    <text y="140" font-family="'Arial Black', 'Impact', sans-serif" font-size="140" font-weight="900" fill="#ffffff" letter-spacing="-2">1000</text>
  </g>

  <!-- Product Illustration: GP 1000 Device -->
  <g transform="translate(185, 340)" filter="url(#shadow2)">
    <!-- Base Shadow -->
    <ellipse cx="215" cy="375" rx="220" ry="18" fill="#000" opacity="0.65" />

    <!-- Top Metal Sturdy Handle -->
    <path d="M55,20 Q215,-15 375,20 Q365,45 215,45 Q65,45 55,20 Z" fill="#2d333b" stroke="#717a86" stroke-width="2" />
    <rect x="110" y="2" width="210" height="24" rx="12" fill="#181a1d" stroke="#484f58" stroke-width="2" />

    <!-- Outer Box Casing -->
    <rect x="0" y="30" width="430" height="340" rx="14" fill="url(#gpBodyGrad)" stroke="#7d8794" stroke-width="3" />

    <!-- Display Screen -->
    <rect x="115" y="55" width="200" height="70" rx="8" fill="#0b0d10" stroke="#1f242c" stroke-width="2" />
    <g fill="#38bdf8" font-family="'Courier New', monospace" font-weight="bold">
      <text x="130" y="80" font-size="10" fill="#94a3b8">AC USB</text>
      <text x="130" y="102" font-size="10" fill="#94a3b8">DC LED</text>
      <text x="215" y="105" font-size="34" font-family="'Arial Black', sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">188<tspan font-size="16" fill="#38bdf8">%</tspan></text>
    </g>

    <!-- Cyan Decorative Ribbon Stripe across front -->
    <rect x="20" y="140" width="390" height="42" rx="4" fill="#38bdf8" />
    <!-- DC & AC Round Knobs & Ports on cyan bar -->
    <circle cx="85" cy="161" r="5" fill="#090a0c" />
    <text x="85" y="174" font-family="sans-serif" font-size="6" fill="#0369a1" font-weight="bold" text-anchor="middle">INPUT</text>
    <circle cx="165" cy="161" r="9" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" />
    <text x="165" y="174" font-family="sans-serif" font-size="6" fill="#0369a1" font-weight="bold" text-anchor="middle">DC POWER</text>
    <!-- USB-C & USB-A Ports -->
    <rect x="195" y="157" width="14" height="8" rx="2" fill="#090a0c" />
    <rect x="220" y="154" width="24" height="14" rx="2" fill="#090a0c" stroke="#0284c7" stroke-width="1" />
    <rect x="255" y="154" width="24" height="14" rx="2" fill="#090a0c" stroke="#0284c7" stroke-width="1" />
    <circle cx="310" cy="161" r="9" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5" />
    <text x="310" y="174" font-family="sans-serif" font-size="6" fill="#0369a1" font-weight="bold" text-anchor="middle">AC POWER</text>

    <!-- 12V Car Auxiliary Outlet (Left) -->
    <circle cx="65" cy="275" r="24" fill="#121518" stroke="#333942" stroke-width="2" />
    <circle cx="65" cy="275" r="16" fill="#090a0c" />

    <!-- EU AC Outlet (Right) -->
    <g transform="translate(315, 235)">
      <rect width="80" height="80" rx="8" fill="#20242a" stroke="#4b535e" stroke-width="2" />
      <circle cx="40" cy="40" r="28" fill="#090a0c" stroke="#383e47" stroke-width="2" />
      <circle cx="30" cy="40" r="4" fill="#64748b" />
      <circle cx="50" cy="40" r="4" fill="#64748b" />
      <text x="40" y="74" font-family="sans-serif" font-size="7" fill="#64748b" font-weight="bold" text-anchor="middle">AC OUTPUT</text>
    </g>
  </g>

  <!-- Left Side Spec List matching exact text in poster -->
  <g transform="translate(25, 470)" font-family="sans-serif" font-size="13.5" fill="#ffffff">
    <text font-weight="bold" fill="#e2e8f0">Output</text>
    <text y="20" fill="#cbd5e1">USB-A x2 :Max.18W</text>
    <text y="38" fill="#cbd5e1">USB-C :Max.lBW</text>

    <text y="70" font-weight="bold" fill="#e2e8f0">Net Weight :~18.9KG(41.7LB)</text>

    <text y="102" font-weight="bold" fill="#e2e8f0">Battery:</text>
    <text y="122" fill="#cbd5e1">Capacity .576Wh(LifePO4)</text>
  </g>

  <!-- Bottom Bar: Hotline + Price Ribbon + Website -->
  <g transform="translate(0, 715)">
    <!-- Hotline -->
    <text x="35" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#18181b">For More Info:</text>
    <text x="35" y="42" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#18181b">+8801306-061919</text>

    <!-- Center Price Hexagon Pill -->
    <g transform="translate(270, 0)">
      <path d="M20,0 L240,0 L260,30 L240,60 L20,60 L0,30 Z" fill="#1e242c" stroke="#333b47" stroke-width="2" filter="url(#shadow2)" />
      <text x="130" y="40" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        PRICE:59999BDT
      </text>
    </g>

    <!-- Website -->
    <text x="765" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#18181b" text-anchor="end">Check Our Site:</text>
    <text x="765" y="42" font-family="'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#18181b" text-anchor="end">solarstock.com</text>
  </g>
</svg>
