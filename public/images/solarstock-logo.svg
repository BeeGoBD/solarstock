<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" fill="none" width="100%" height="100%">
  <defs>
    <filter id="solar-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F37023" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. SUN RAYS & SUN DISK -->
  <!-- 7 Sun Rays radiating to top-left -->
  <g stroke="#F37023" stroke-width="4.5" stroke-linecap="round">
    <line x1="168" y1="95" x2="164" y2="82" />
    <line x1="154" y1="102" x2="146" y2="90" />
    <line x1="144" y1="114" x2="132" y2="105" />
    <line x1="138" y1="129" x2="124" y2="124" />
    <line x1="136" y1="145" x2="121" y2="145" />
    <line x1="140" y1="161" x2="126" y2="166" />
    <line x1="149" y1="175" x2="137" y2="183" />
  </g>

  <!-- Orange Sun Disk nestled behind the S-curve -->
  <circle cx="178" cy="138" r="24" fill="#F37023" />

  <!-- 2. STYLIZED 'S' EMBLEM -->
  <!-- Orange Outer Dynamic Swish Accent -->
  <path
    d="M 174 122 
       C 210 102, 255 106, 275 136
       C 278 141, 274 148, 267 146
       C 255 142, 240 140, 226 142
       C 205 145, 185 158, 175 178
       C 166 195, 168 215, 178 230
       C 192 250, 218 268, 246 266
       C 256 265, 263 260, 266 254
       C 264 263, 254 272, 240 274
       C 208 277, 178 253, 164 228
       C 152 206, 153 175, 166 150
       C 168 142, 170 131, 174 122 Z"
    fill="#F37023"
  />

  <!-- Green Main 'S' Leaf / Solar Wave -->
  <path
    d="M 182 126
       C 214 110, 248 114, 263 135
       C 265 138, 261 142, 256 140
       C 242 136, 226 135, 212 142
       C 194 150, 180 166, 175 186
       C 170 206, 177 225, 192 238
       C 210 254, 234 260, 255 252
       C 246 263, 230 268, 216 267
       C 192 265, 175 248, 166 228
       C 158 206, 162 178, 174 154
       C 176 144, 178 135, 182 126 Z"
    fill="#398E2E"
  />

  <!-- Inner Green Core / S Wave Depth -->
  <path
    d="M 188 130
       C 216 117, 242 120, 254 136
       C 240 132, 224 133, 212 140
       C 190 152, 176 172, 175 198
       C 174 218, 184 236, 201 247
       C 218 257, 238 258, 254 250
       C 244 261, 228 266, 214 265
       C 188 262, 171 242, 168 220
       C 164 195, 171 166, 188 130 Z"
    fill="#398E2E"
  />

  <!-- 3. WORDMARK 'SOLARSTOCK' -->
  <!-- 'SOLAR' in bold italic stylized orange -->
  <g transform="translate(48, 290) skewX(-14)">
    <text
      x="0"
      y="0"
      font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif"
      font-size="44"
      font-weight="900"
      font-style="italic"
      letter-spacing="0.5"
    >
      <tspan fill="#F37023">SOLAR</tspan><tspan fill="#398E2E">STOCK</tspan>
    </text>
  </g>

  <!-- 4. TAGLINE 'We stock solar' -->
  <text
    x="210"
    y="326"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Outfit', 'Segoe UI', sans-serif"
    font-size="21"
    font-weight="400"
    letter-spacing="4.5"
    fill="#398E2E"
  >
    We stock solar
  </text>
</svg>
