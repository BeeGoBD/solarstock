<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24272c" />
      <stop offset="50%" stop-color="#191b1e" />
      <stop offset="100%" stop-color="#0f1012" />
    </linearGradient>
    <linearGradient id="yellowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb024" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gp600Body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a515c" />
      <stop offset="60%" stop-color="#282c33" />
      <stop offset="100%" stop-color="#191c20" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad3)" />

  <!-- Diagonal Yellow Geometric Shapes at Bottom -->
  <polygon points="0,620 180,800 0,800" fill="#fbb024" />
  <polygon points="800,620 620,800 800,800" fill="#fbb024" />
  <polygon points="0,680 800,680 800,800 0,800" fill="#f59e0b" opacity="0.9" />

  <!-- Top Left Brand -->
  <g transform="translate(35, 60)">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#9ca3af" letter-spacing="1">
      SOLARSTOCK<tspan font-size="20" dy="-14" fill="#60a5fa">BD</tspan>
    </text>
    <text x="35" y="32" font-family="'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif" font-size="20" fill="#cbd5e1" font-style="italic">
      Beat The Clock
    </text>
  </g>

  <!-- Top Right Disc 20% Flag Ribbon -->
  <g transform="translate(610, 0)">
    <path d="M0,0 L115,0 L115,160 L57.5,130 L0,160 Z" fill="url(#yellowGrad3)" filter="url(#shadow3)" />
    <text x="57" y="70" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#18181b" text-anchor="middle">Disc</text>
    <text x="57" y="118" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#18181b" text-anchor="middle">20%</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <text font-family="'Arial Black', 'Impact', sans-serif" font-size="68" font-weight="900" fill="#f59e0b" letter-spacing="4">GP</text>
    <text y="140" font-family="'Arial Black', 'Impact', sans-serif" font-size="140" font-weight="900" fill="#ffffff" letter-spacing="-2">600</text>
  </g>

  <!-- Product Illustration: GP 600 in 3/4 Perspective -->
  <g transform="translate(170, 320)" filter="url(#shadow3)">
    <!-- Base Shadow -->
    <ellipse cx="230" cy="370" rx="230" ry="18" fill="#000" opacity="0.65" />

    <!-- Top Folding Handle -->
    <path d="M120,30 Q230,0 340,30 L340,55 Q230,25 120,55 Z" fill="#2d333b" stroke="#717a86" stroke-width="2" />

    <!-- 3D Perspective Right Panel -->
    <polygon points="310,60 460,100 460,340 310,340" fill="#1c1f24" stroke="#3d444e" stroke-width="2" />
    <!-- Honeycomb vent holes on right panel -->
    <g fill="#0b0d0f" transform="translate(330, 120)">
      <circle cx="20" cy="15" r="3.5" /><circle cx="35" cy="15" r="3.5" /><circle cx="50" cy="15" r="3.5" /><circle cx="65" cy="15" r="3.5" /><circle cx="80" cy="15" r="3.5" /><circle cx="95" cy="15" r="3.5" />
      <circle cx="27" cy="28" r="3.5" /><circle cx="42" cy="28" r="3.5" /><circle cx="57" cy="28" r="3.5" /><circle cx="72" cy="28" r="3.5" /><circle cx="87" cy="28" r="3.5" /><circle cx="102" cy="28" r="3.5" />
      <circle cx="20" cy="41" r="3.5" /><circle cx="35" cy="41" r="3.5" /><circle cx="50" cy="41" r="3.5" /><circle cx="65" cy="41" r="3.5" /><circle cx="80" cy="41" r="3.5" /><circle cx="95" cy="41" r="3.5" />
      <circle cx="27" cy="54" r="3.5" /><circle cx="42" cy="54" r="3.5" /><circle cx="57" cy="54" r="3.5" /><circle cx="72" cy="54" r="3.5" /><circle cx="87" cy="54" r="3.5" /><circle cx="102" cy="54" r="3.5" />
    </g>
    <!-- Right side AC connector -->
    <rect x="360" y="270" width="45" height="45" rx="4" fill="#0d0e11" stroke="#2b3038" stroke-width="1.5" />

    <!-- Front Casing -->
    <rect x="0" y="60" width="310" height="280" rx="10" fill="url(#gp600Body)" stroke="#7d8794" stroke-width="2.5" />

    <!-- Display Screen -->
    <rect x="75" y="80" width="160" height="55" rx="6" fill="#0b0d10" stroke="#1f242c" stroke-width="2" />
    <g fill="#38bdf8" font-family="'Courier New', monospace" font-weight="bold">
      <text x="85" y="100" font-size="9" fill="#94a3b8">AC USB</text>
      <text x="85" y="120" font-size="9" fill="#94a3b8">DC LED</text>
      <text x="155" y="120" font-size="28" font-family="'Arial Black', sans-serif" font-weight="900" fill="#ffffff">188<tspan font-size="14" fill="#38bdf8">%</tspan></text>
    </g>

    <!-- Cyan Decorative Ribbon Stripe across front -->
    <rect x="15" y="150" width="280" height="30" rx="3" fill="#38bdf8" />
    <circle cx="55" cy="165" r="4" fill="#090a0c" />
    <circle cx="110" cy="165" r="7" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.2" />
    <rect x="135" y="162" width="12" height="6" rx="1.5" fill="#090a0c" />
    <rect x="155" y="160" width="18" height="10" rx="1.5" fill="#090a0c" stroke="#0284c7" stroke-width="1" />
    <rect x="180" y="160" width="18" height="10" rx="1.5" fill="#090a0c" stroke="#0284c7" stroke-width="1" />
    <circle cx="225" cy="165" r="7" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.2" />

    <!-- 12V Car Auxiliary Outlet (Left) -->
    <circle cx="50" cy="265" r="18" fill="#121518" stroke="#333942" stroke-width="1.5" />

    <!-- Dual TR AC Sockets (Right) -->
    <g transform="translate(230, 205)">
      <rect width="60" height="90" rx="6" fill="#20242a" stroke="#4b535e" stroke-width="1.5" />
      <rect x="15" y="12" width="8" height="18" fill="#000" rx="1" />
      <rect x="35" y="12" width="8" height="18" fill="#000" rx="1" />
      <rect x="15" y="55" width="8" height="18" fill="#000" rx="1" />
      <rect x="35" y="55" width="8" height="18" fill="#000" rx="1" />
      <text x="48" y="32" font-family="sans-serif" font-size="6" fill="#64748b" font-weight="bold">TR</text>
      <text x="48" y="75" font-family="sans-serif" font-size="6" fill="#64748b" font-weight="bold">TR</text>
    </g>
  </g>

  <!-- Left Side Spec List matching exact text in poster -->
  <g transform="translate(25, 470)" font-family="sans-serif" font-size="13" fill="#ffffff">
    <text font-weight="bold" fill="#e2e8f0">Output</text>
    <text y="18" fill="#cbd5e1">USB-Ax2 :Max.18W</text>
    <text y="35" fill="#cbd5e1">USB-C :Max.18W</text>

    <text y="65" font-weight="bold" fill="#e2e8f0">Net Weight :6 9KG(15.2LB)</text>

    <text y="95" font-weight="bold" fill="#e2e8f0">Battery:</text>
    <text y="113" fill="#cbd5e1">Capacity .576Wh(LifeP04)</text>
    <text y="131" fill="#cbd5e1">Recharge Time : AC ~4.7Hrs;</text>
    <text y="149" fill="#cbd5e1">Solar :~7.6Hrs</text>
  </g>

  <!-- Bottom Bar: Hotline + Price Ribbon + Website -->
  <g transform="translate(0, 715)">
    <!-- Hotline -->
    <text x="35" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#18181b">For More Info:</text>
    <text x="35" y="42" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#18181b">+8801306-061919</text>

    <!-- Center Price Hexagon Pill -->
    <g transform="translate(270, 0)">
      <path d="M20,0 L240,0 L260,30 L240,60 L20,60 L0,30 Z" fill="#1e242c" stroke="#333b47" stroke-width="2" filter="url(#shadow3)" />
      <text x="130" y="40" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        PRICE:34999BDT
      </text>
    </g>

    <!-- Website -->
    <text x="765" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#18181b" text-anchor="end">Check Our Site:</text>
    <text x="765" y="42" font-family="'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#18181b" text-anchor="end">solarstock.com</text>
  </g>
</svg>
