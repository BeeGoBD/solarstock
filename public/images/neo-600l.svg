<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24272c" />
      <stop offset="50%" stop-color="#191b1e" />
      <stop offset="100%" stop-color="#0f1012" />
    </linearGradient>
    <linearGradient id="yellowGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbb024" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="neo600Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#646b76" />
      <stop offset="35%" stop-color="#3c424a" />
      <stop offset="100%" stop-color="#181a1d" />
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad5)" />

  <!-- Diagonal Yellow Geometric Shapes at Bottom -->
  <polygon points="0,620 180,800 0,800" fill="#fbb024" />
  <polygon points="800,620 620,800 800,800" fill="#fbb024" />
  <polygon points="0,680 800,680 800,800 0,800" fill="#f59e0b" opacity="0.9" />

  <!-- Top Left Brand -->
  <g transform="translate(35, 60)">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#9ca3af" letter-spacing="1">
      SOLARSTOCK<tspan font-size="20" dy="-14" fill="#60a5fa">BD</tspan>
    </text>
    <text x="35" y="32" font-family="'Brush Script MT', 'Lucida Handwriting', cursive, sans-serif" font-size="20" fill="#cbd5e1" font-style="italic">
      Beat The Clock
    </text>
  </g>

  <!-- Top Right Disc 20% Flag Ribbon -->
  <g transform="translate(610, 0)">
    <path d="M0,0 L115,0 L115,160 L57.5,130 L0,160 Z" fill="url(#yellowGrad5)" filter="url(#shadow5)" />
    <text x="57" y="70" font-family="'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#18181b" text-anchor="middle">Disc</text>
    <text x="57" y="118" font-family="'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#18181b" text-anchor="middle">20%</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <text font-family="'Arial Black', 'Impact', sans-serif" font-size="58" font-weight="900" fill="#f59e0b" letter-spacing="4">NEO</text>
    <text y="140" font-family="'Arial Black', 'Impact', sans-serif" font-size="140" font-weight="900" fill="#ffffff" letter-spacing="-2">600L</text>
  </g>

  <!-- Product Illustration: NEO 600L Device -->
  <g transform="translate(180, 320)" filter="url(#shadow5)">
    <!-- Base Shadow -->
    <ellipse cx="230" cy="370" rx="220" ry="18" fill="#000" opacity="0.65" />

    <!-- Outer Molded Chassis with Arched Carry Handle -->
    <path d="M60,60 Q230,-10 400,60 Q450,90 450,150 L450,315 Q450,350 400,350 L60,350 Q10,350 10,315 L10,150 Q10,90 60,60 Z" fill="url(#neo600Grad)" stroke="#818b99" stroke-width="2.5" />

    <!-- Handle Opening -->
    <path d="M120,60 Q230,25 340,60 Q310,85 230,85 Q150,85 120,60 Z" fill="#141619" stroke="#3d444f" stroke-width="2" />

    <!-- Right Side Slanted Ventilation Grille -->
    <g transform="translate(320, 110)">
      <path d="M0,15 L115,5 L115,220 L0,220 Z" fill="#191c20" stroke="#31363e" stroke-width="1.5" />
      <line x1="15" y1="30" x2="95" y2="200" stroke="#0b0d0f" stroke-width="7" stroke-linecap="round" />
      <line x1="35" y1="30" x2="105" y2="180" stroke="#0b0d0f" stroke-width="7" stroke-linecap="round" />
      <line x1="55" y1="30" x2="110" y2="150" stroke="#0b0d0f" stroke-width="7" stroke-linecap="round" />
      <line x1="75" y1="30" x2="110" y2="110" stroke="#0b0d0f" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Front Panel -->
    <path d="M20,100 L310,100 L310,335 L20,335 Z" fill="#292e35" stroke="#3e4550" stroke-width="1.5" rx="12" />

    <!-- High-Tech Color LCD Display Panel -->
    <rect x="35" y="115" width="260" height="60" rx="8" fill="#08090b" stroke="#1d2229" stroke-width="2" />
    <!-- Graphic Battery Indicator -->
    <rect x="50" y="125" width="22" height="40" rx="3" fill="#000" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="53" y="132" width="16" height="6" rx="1" fill="#38bdf8" />
    <rect x="53" y="140" width="16" height="6" rx="1" fill="#38bdf8" />
    <rect x="53" y="148" width="16" height="6" rx="1" fill="#38bdf8" />
    <rect x="53" y="156" width="16" height="6" rx="1" fill="#38bdf8" />
    <text x="130" y="142" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8">AC USB</text>
    <text x="130" y="162" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#38bdf8">DC LED</text>

    <!-- Weatherproof Protected Flaps & Sockets -->
    <!-- Car Socket Flap (Left) -->
    <rect x="35" y="195" width="60" height="75" rx="8" fill="#1c2026" stroke="#414854" stroke-width="2" />
    <text x="65" y="235" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold" text-anchor="middle">CAR</text>
    <text x="65" y="247" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold" text-anchor="middle">SOCKET</text>

    <!-- Center Ports -->
    <g transform="translate(105, 195)">
      <text x="15" y="12" font-family="sans-serif" font-size="5.5" fill="#64748b">USB-C 100W</text>
      <rect x="15" y="15" width="16" height="9" rx="3" fill="#0b0d0f" stroke="#64748b" stroke-width="1" />
      <text x="50" y="12" font-family="sans-serif" font-size="5.5" fill="#64748b">USB-A 18W</text>
      <rect x="50" y="15" width="18" height="11" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <text x="85" y="12" font-family="sans-serif" font-size="5.5" fill="#64748b">USB-C 60W</text>
      <rect x="85" y="15" width="16" height="9" rx="3" fill="#0b0d0f" stroke="#64748b" stroke-width="1" />

      <!-- DC & AC Power buttons below -->
      <circle cx="23" cy="50" r="7" fill="#1e232a" stroke="#64748b" stroke-width="1.2" />
      <circle cx="60" cy="50" r="5" fill="#0b0d0f" stroke="#f59e0b" stroke-width="1.2" />
      <circle cx="93" cy="50" r="7" fill="#1e232a" stroke="#64748b" stroke-width="1.2" />
    </g>

    <!-- AC Outlet Weather Flap (Right) -->
    <rect x="235" y="195" width="60" height="75" rx="8" fill="#1c2026" stroke="#414854" stroke-width="2" />
    <text x="265" y="235" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold" text-anchor="middle">AC</text>
    <text x="265" y="247" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold" text-anchor="middle">OUTLET</text>

    <!-- Cyan Glowing LED Ambient Bar matching poster -->
    <rect x="20" y="285" width="290" height="6" rx="3" fill="#38bdf8" />
  </g>

  <!-- Left Side Spec List matching exact text in poster -->
  <g transform="translate(25, 470)" font-family="sans-serif" font-size="13" fill="#ffffff">
    <text font-weight="bold" fill="#e2e8f0">Output</text>
    <text y="18" fill="#cbd5e1">U600W (Surge 1200W)</text>

    <text y="48" font-weight="bold" fill="#e2e8f0">Net Weight : 6.6 KG / 14.52 lb</text>

    <text y="78" font-weight="bold" fill="#e2e8f0">Battery:</text>
    <text y="96" fill="#cbd5e1">Capacity :512Wh (LifePO4)</text>
    <text y="114" fill="#cbd5e1">Recharge Time::AC :~2Hrs;</text>
    <text y="132" fill="#cbd5e1">Solar: ~3.4 Hrs</text>
  </g>

  <!-- Bottom Bar: Hotline + Price Ribbon + Website -->
  <g transform="translate(0, 715)">
    <!-- Hotline -->
    <text x="35" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#18181b">For More Info:</text>
    <text x="35" y="42" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#18181b">+8801306-061919</text>

    <!-- Center Price Hexagon Pill -->
    <g transform="translate(270, 0)">
      <path d="M20,0 L240,0 L260,30 L240,60 L20,60 L0,30 Z" fill="#1e242c" stroke="#333b47" stroke-width="2" filter="url(#shadow5)" />
      <text x="130" y="40" font-family="'Arial Black', sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        PRICE:48999BDT
      </text>
    </g>

    <!-- Website -->
    <text x="765" y="18" font-family="sans-serif" font-size="13" font-weight="bold" fill="#18181b" text-anchor="end">Check Our Site:</text>
    <text x="765" y="42" font-family="'Arial Black', sans-serif" font-size="19" font-weight="900" fill="#18181b" text-anchor="end">solarstock.com</text>
  </g>
</svg>
